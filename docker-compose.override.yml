# docker-compose.override.yml — loaded automatically alongside docker-compose.yml
#
# BACKEND ONLY: live bind-mounts for backend/ and scripts/. These are
# OPERATIONAL, not just dev convenience — the launchd pipelines run
# `docker compose exec backend python scripts/…` and rely on reading the
# CURRENT scripts from the mount (no image rebuild per edit).
#
# The frontend dev/HMR service was deliberately moved to docker-compose.dev.yml
# (opt-in). It used to live here, which meant any `docker compose up -d frontend`
# silently replaced the production build with `next dev` — bad for the public
# site (slow, unoptimised, dev overlays). Prod deploys: scripts/deploy_frontend.sh.

services:

  backend:
    volumes:
      - ./backend:/app/backend   # live Python changes without rebuild
      - ./scripts:/app/scripts
      # Read-only, and only so the cross-stack guards in the test suite see the
      # CURRENT frontend. Several tests assert that backend concepts and the
      # pages rendering them agree (every ticket profile has both translations;
      # no payout is rendered without its probability). CI runs pytest on a
      # plain checkout so it reads the real tree — without this mount the same
      # tests read the stale copy baked into the image at `COPY . .` and fail
      # locally for a reason that has nothing to do with the code.
      - ./frontend/src:/app/frontend/src:ro
      # Same reason, for the launchd schedules: the credit-budget test
      # reads them to check the odds poll still runs 8-hourly. Without
      # this it read the stale copy from the image and failed locally
      # while passing in CI — which is the worst way round.
      - ./launchd:/app/launchd:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"
