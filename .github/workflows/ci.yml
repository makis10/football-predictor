name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      # The suite is DB-independent; a dummy URL keeps SQLAlchemy engine creation
      # happy without provisioning Postgres.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      INTERNAL_API_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        run: python -m pytest backend/tests/ -q --junitxml=pytest-report.xml

      # vitest writes a job summary by itself, pytest does not — so the CI page
      # used to show the frontend's test count and nothing else, as if 66 were
      # the whole suite. `if: always()` so a failing run still reports which
      # tests failed instead of only the count it never reached.
      - name: Test summary
        if: always()
        run: python scripts/pytest_summary.py pytest-report.xml

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      # NOTE: no lint step — `next lint` was removed in Next 16 and no
      # standalone eslint config exists; `next build` + tsc cover correctness.
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/proxy
          NEXTAUTH_SECRET: ci-build-secret
